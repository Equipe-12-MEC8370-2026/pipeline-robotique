# P3 (SmolVLA) — SmolVLA fine-tuned from the official base on the P3 profile-stack dataset (500 scripted demos
# generated from the CTA TaskSpec, radians, 30 Hz, English instruction in every frame), the SAME data as ACT P3
# (train_act_p3.yaml), for a fair comparison. Same settings as P1 (train_smolvla_p1.yaml) except the data, the
# number of steps and the matching cosine decay. Launch through scripts/train/train_act.py --config <this file>.
#
# Steps: P1 did 30K steps x 16 = ~10 epochs of 47K frames; here 375K frames, so 30K steps = ~1.3 epochs.
# 60K steps = ~2.6 epochs (ACT P3: ~4.3); the cosine decay is stretched to the same length.

dataset:
  repo_id: cta/p3_profile_stack
  root: data/datasets/p3_profile_stack  # relative to cta-learn/
  video_backend: pyav                   # torchcodec DLLs do not load on this Windows station

policy:
  path: data/pretrained/smolvla_base    # relative to cta-learn/ (pinned, hash-verified public base, P1.2)
  device: cuda
  push_to_hub: false
  empty_cameras: 1                      # base was trained with 3 cameras; the 3rd slot is padded
  scheduler_decay_steps: 60000          # = steps (base: 30000 = its own number of steps)

# sim camera names -> base camera slots (front = 3rd-person view, wrist = gripper view)
rename_map:
  observation.images.front: observation.images.camera1
  observation.images.wrist: observation.images.camera2

output_dir: outputs/train/smolvla_p3    # relative to cta-learn/; LeRobot refuses to overwrite it
job_name: smolvla_p3
seed: 1000
batch_size: 16                          # P1.4 smoke tests: best throughput on the 12 GB GPU
num_workers: 4
steps: 60000                            # set from the smoke-test speed (P1: 2.18 steps/s -> ~7.6 h)
log_freq: 200
save_freq: 10000                        # 1.3 GB per checkpoint
env_eval_freq: 0                        # sim evaluation runs in isaacsim-env (P3.5 protocol)
wandb:
  enable: false
