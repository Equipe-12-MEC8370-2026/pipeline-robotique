# P0.6 — ACT on dataset v2 = the 150 P0 demos + 47 recovery demos (missed grasp -> regrasp).
# Same hyper-parameters as train_act_p0.yaml (one change at a time: the data). Launch via scripts/train/train_act.py.

dataset:
  repo_id: cta/p0_pickplace_v2
  root: data/datasets/p0_pickplace_v2      # relative to cta-learn/
  video_backend: pyav                   # torchcodec DLLs do not load on this Windows station
  use_imagenet_stats: true

policy:
  type: act
  device: cuda
  push_to_hub: false
  chunk_size: 100
  n_action_steps: 100
  use_vae: true

output_dir: outputs/train/act_p0_v2        # relative to cta-learn/; LeRobot refuses to overwrite it
job_name: act_p0_v2
seed: 1000
batch_size: 8
num_workers: 4
steps: 100000
log_freq: 200
save_freq: 10000
env_eval_freq: 0                        # sim evaluation is P0.5 (Isaac lives in another venv)
wandb:
  enable: false
