# D12 trial v2 — same as train_act_p3_mimic.yaml, on demos generated WITHOUT action noise (data/datasets/p3_mimic_v2):
# v1 used action_noise 2 mm per step, which made the joint actions 8x jerkier than the expert's (ACT 14/50).
#
# rendered with cameras by scripts/sim/render_mimic_demos.py). Same policy settings as ACT P3 (train_act_p3.yaml); only
# the data, the number of steps and the output change. Launch through scripts/train/train_act.py --config <this file>.
# Steps: ~200 demos x ~840 frames = ~170K frames; 100K steps x 8 = ~4.7 epochs (ACT P3: ~4.3 on 375K frames).
# Compared with ACT P3 (500 expert demos, 44/50) on the same 50 evaluation trials (P3.5 protocol).

dataset:
  repo_id: cta/p3_mimic_v2
  root: data/datasets/p3_mimic_v2        # relative to cta-learn/
  video_backend: pyav                   # torchcodec DLLs do not load on this Windows station
  use_imagenet_stats: true

policy:
  type: act
  device: cuda
  push_to_hub: false
  chunk_size: 100
  n_action_steps: 100
  use_vae: true

output_dir: outputs/train/act_p3_mimic_v2       # relative to cta-learn/; LeRobot refuses to overwrite it
job_name: act_p3_mimic_v2
seed: 1000
batch_size: 8
num_workers: 4
steps: 100000
log_freq: 200
save_freq: 20000
env_eval_freq: 0                        # sim evaluation is P3.5 (Isaac lives in another venv)
wandb:
  enable: false
