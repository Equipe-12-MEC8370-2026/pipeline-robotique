  angle_block:
    prompts:
      - {t: 29.5, box: [865, 492, 990, 642]}   # final state, screw in place, hands away
      - {t: 13.0, box: [858, 500, 988, 642]}   # just placed at the front, hands beside it
    check_start: {t: 0.5, box: [1088, 258, 1188, 362]}
