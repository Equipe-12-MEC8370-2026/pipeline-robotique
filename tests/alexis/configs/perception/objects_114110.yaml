# SAM 2 prompts for the "equerre" (machined aluminium angle block) in the TPV view of pair_20260831_114110
# (set-up B). Boxes in full-resolution clip pixels [x0, y0, x1, y1], placed by hand on gridded frames (2026-11-18).
# prompts: block at rest at the front, no hand on it (after the first placement, and at the end with the screw in).
#   Two prompts because the hands cover it while screwing (~17-24 s) and it is lifted to be checked (~24-28 s).
# check_start: the block in the rack area at the back right, before the pick. NOT a prompt: backward tracking must
#   land on it by itself. The screw is not tracked (a few millimetres in the TPV view).

